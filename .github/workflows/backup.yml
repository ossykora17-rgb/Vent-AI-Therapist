name: backup

# The copy that exists for the one failure nothing else covers.
#
# Supabase Hobby keeps no automated backups. Everything in this product that
# a person would grieve — their carve, what held them, what they wrote at 2am
# — lives in one database with no second copy anywhere.
#
# Circle transcripts are deliberately not in it. They are destroyed when a
# circle closes and that deletion is the promise the room is built on; a
# nightly job copying them somewhere durable would turn a room that forgets
# into a room that remembers forever, off-site. See the route.
#
# Three things here are load-bearing rather than tidy:
#
#   1. It fails the job when the export is incomplete. A backup that silently
#      dropped a table is the shape of every other bug in this repo: an
#      artifact that looks exactly like a good one until the day it is needed.
#      `complete: false` is louder than a missing run.
#   2. The artifact is never printed. `curl -o` writes to a file and nothing
#      in this job cats it — a job log is readable by anybody with repo access
#      and would otherwise contain everybody's history in plain text.
#   3. It is skipped, not failed, when no token is set. A repository that has
#      not turned this on should not have a red cross every morning; the
#      health endpoint is where "backups are off" belongs, because that is the
#      surface somebody reads on purpose.
#   4. The copy is encrypted before it is uploaded, and the plaintext never is.
#      This repository is public, and a public repository's artifacts can be
#      downloaded by anybody signed in to GitHub. For ten nights (runs 28-37)
#      this job uploaded every vent, every note and every anon id — which here
#      is the whole credential — in plain JSON, under a comment saying
#      artifacts were private. Point 2 guarded the log; nothing guarded the
#      file. The key is VENT_BACKUP_TOKEN: whoever holds it can already pull
#      the plaintext from /api/export, so it adds no reach, and it needs no new
#      secret. A token under 32 characters is refused, because the copy is
#      only as strong as it. To open one:
#
#        unzip vent-backup-<run>.zip
#        VENT_BACKUP_TOKEN='<the token>' openssl enc -d -aes-256-cbc -pbkdf2 \
#          -iter 600000 -in backup.json.enc -out backup.json -pass env:VENT_BACKUP_TOKEN
#
#      Rotating the token does not re-key old copies; keep the old token with
#      them for as long as they are kept.

on:
  schedule:
    - cron: "0 2 * * *" # 03:00 WAT, the quietest hour here
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Take the copy
        id: take
        env:
          TOKEN: ${{ secrets.VENT_BACKUP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "VENT_BACKUP_TOKEN is not set — backups are off. Nothing to do."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            # Says so on the run's own page, not only in a log nobody opens.
            #
            # Point 3 above is still right — a repository that has not turned
            # this on should not have a red cross every morning. But the shape
            # it left behind is this project's oldest recorded bug: fourteen
            # consecutive green ticks, each one six seconds long, each one
            # meaning no copy was taken. A green light over a broken road.
            #
            # /api/health does report `backups: "off"`, and that is the right
            # surface for somebody asking on purpose. This is for the surface
            # somebody actually glances at.
            {
              echo "### No backup was taken"
              echo
              echo "\`VENT_BACKUP_TOKEN\` is not set on this repository, so this run did nothing."
              echo "Supabase Hobby keeps no automated backups either — there is currently **no copy**"
              echo "of anybody's carve, notes or history anywhere."
              echo
              echo "To turn it on, the same secret has to exist in two places:"
              echo "- this repository: Settings → Secrets and variables → Actions → \`VENT_BACKUP_TOKEN\`"
              echo "- the deployment: Vercel → Project → Settings → Environment Variables → \`VENT_BACKUP_TOKEN\`"
              echo
              echo "Set one side only and this job goes red with a 501, which is the intended signal."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # The token is the encryption key below, so a short one would make the
          # copy guessable offline by anybody who downloads it.
          if [ "${#TOKEN}" -lt 32 ]; then
            echo "VENT_BACKUP_TOKEN is shorter than 32 characters — no copy was taken."
            {
              echo "### No backup was kept"
              echo
              echo "\`VENT_BACKUP_TOKEN\` is shorter than 32 characters. It is the key the copy is"
              echo "encrypted with, and this repository's artifacts are public, so a short one"
              echo "would make everybody's history guessable. Generate one with"
              echo "\`openssl rand -hex 32\` and set it in both places (this repository's Actions"
              echo "secrets, and the Vercel project's environment variables)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          BASE="${VENT_URL:-https://vent-ai-therapist.vercel.app}"
          CODE=$(curl -sS --max-time 90 \
            -H "authorization: Bearer $TOKEN" \
            -o backup.json -w '%{http_code}' \
            "$BASE/api/export")

          # 501 means the deployment has no token even though this repo does,
          # which is a real mismatch and worth a red run: somebody set one side.
          if [ "$CODE" != "200" ] && [ "$CODE" != "207" ]; then
            echo "export returned $CODE"
            node -e 'try{const b=require("./backup.json");console.log(b.error,b.message||"")}catch{}'
            exit 1
          fi

          # Encrypted before anything else can fail, and the plaintext removed
          # whatever the count below decides — only backup.json.enc is uploaded.
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in backup.json -out backup.json.enc -pass env:TOKEN

          status=0
          node -e '
            const b = require("./backup.json");
            const counts = Object.entries(b.tables || {})
              .map(([t, n]) => `${t}=${n}`).join(" ");
            console.log(`taken ${b.takenAt} · commit ${b.commit}`);
            console.log(`rows ${counts}`);
            console.log(`excluded ${(b.excluded || []).join(", ") || "nothing"}`);
            if (!b.complete) {
              for (const [t, e] of Object.entries(b.errors || {})) {
                console.log(`  ${t}: [${e.code ?? "?"}] ${e.hint ?? "no hint"}`);
              }
              for (const t of b.truncated || []) console.log(`  ${t}: hit the row cap`);
              // A partial copy is reported and still kept — half a backup is
              // worth more than none, and a green tick over it is worth less
              // than nothing.
              process.exitCode = 1;
            }
          ' || status=$?
          rm -f backup.json
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "Encrypted with VENT_BACKUP_TOKEN (AES-256-CBC, PBKDF2 600000). The header of this file says how to open it." >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Kept even when the step above failed, for the same reason it fails:
      # a partial copy is still the only copy.
      # `!cancelled()` is what makes that true: without it a step's `if` implies
      # success(), and the copy was skipped on exactly the runs this describes.
      - name: Keep it
        if: ${{ !cancelled() && steps.take.outputs.skipped != 'true' && hashFiles('backup.json.enc') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vent-backup-${{ github.run_id }}
          path: backup.json.enc
          retention-days: 90
          # This repository is public, so its artifacts are readable by anybody
          # signed in to GitHub. Only the encrypted file is ever named here.
          if-no-files-found: error
